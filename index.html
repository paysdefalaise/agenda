<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />
  <meta name="robots" content="noindex, nofollow" />

  <title>Agenda communautaire</title>

  <script
    src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"
    integrity="sha384-LjuMvep2w70bTtVscyL+xkqhYr7Y0kTM4t5cwWMy0xOTfl5duHb7MnP6K3J3/4Mk"
    crossorigin="anonymous"
  ></script>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="header">

    <div class="header-left">
      <img src="logo.webp" alt="Logo" class="logo" />
    </div>

    <div class="header-right">
      <h1>Agenda communautaire</h1>
      <p>
        Retrouvez toutes les réunions<br>
        du Pays de Falaise Normandie
      </p>
    </div>

  </header>

  <main class="container">
    <div id="calendar"></div>
  </main>

  <div id="event-modal" class="modal is-hidden" aria-hidden="true">
    <div class="modal-backdrop" data-modal-close></div>

    <div
      class="modal-dialog"
      role="dialog"
      aria-modal="true"
      aria-labelledby="event-modal-title"
    >
      <button type="button" class="modal-close" data-modal-close aria-label="Fermer la fenêtre">
        ×
      </button>

      <h2 id="event-modal-title">Détails de l'événement</h2>

      <dl class="modal-details">
        <div>
          <dt>Titre</dt>
          <dd id="modal-event-title"></dd>
        </div>
        <div>
          <dt>Début</dt>
          <dd id="modal-event-start"></dd>
        </div>
        <div>
          <dt>Fin</dt>
          <dd id="modal-event-end"></dd>
        </div>
        <div id="modal-event-location-row">
          <dt>Lieu</dt>
          <dd id="modal-event-location"></dd>
        </div>
      </dl>
    </div>
  </div>

  <footer class="footer">

    <div class="footer-left">
      <img src="logo.webp" alt="Logo" class="footer-logo" />
    </div>

    <div class="footer-center">
      <h3>Pays de Falaise Normandie</h3>
      <p>
        17 rue de l'Industrie - 14700 Falaise<br>
        02 31 90 42 18
      </p>
    </div>

    <div class="footer-right">
      Dernière mise à jour :
      <span id="last-update" aria-live="polite"></span>
    </div>

  </footer>

  <script src="script.js"></script>

</body>

</html>
