<!DOCTYPE html>
<html lang="fr">

<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0" />

  <title>Agenda communautaire</title>

  <script src="https://cdn.jsdelivr.net/npm/fullcalendar@6.1.19/index.global.min.js"></script>

  <link rel="stylesheet" href="style.css" />
</head>

<body>

  <header class="header">

    <div class="header-left">
      <img src="logo.webp" alt="Logo" class="logo" />
    </div>

    <div class="header-right">
      <h1>Agenda communautaire</h1>
      <p>
        Retrouvez toutes les réunions<br>
        du Pays de Falaise Normandie
      </p>
    </div>

  </header>

  <main class="container">
    <div id="calendar"></div>
  </main>

  <footer class="footer">

    <div class="footer-left">
      <img src="logo.webp" alt="Logo" class="footer-logo" />
    </div>

    <div class="footer-center">
      <h3>Pays de Falaise Normandie</h3>
      <p>
        17 rue de l'Industrie - 14700 Falaise<br>
        02 31 90 42 18
      </p>
    </div>

    <div class="footer-right">
      Dernière mise à jour :
      <span id="last-update"></span>
    </div>

  </footer>

  <script src="script.js"></script>

</body>

</html>
