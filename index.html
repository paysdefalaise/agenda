<!DOCTYPE html>
<html>
<head>
  <meta charset="UTF-8">
  <title>Agenda</title>
</head>
<body>
  <h1>Agenda public</h1>

  <pre id="output"></pre>

  <script>
    fetch('./events.json')
      .then(r => r.json())
      .then(data => {
        document.getElementById('output').textContent =
          JSON.stringify(data, null, 2)
      })
  </script>
</body>
</html>
